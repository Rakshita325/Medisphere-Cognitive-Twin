spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/medisphere}
spring.data.mongodb.database=${MONGODB_DATABASE:medisphere}
server.port=${SERVER_PORT:8081}

ml.service.base-url=${ML_SERVICE_BASE_URL:http://127.0.0.1:5000}

medisphere.kafka.enabled=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

medisphere.fhir.base-url=${FHIR_BASE_URL:https://r4.quality.hl7.org/fhir}
medisphere.fhir.connect-timeout=${FHIR_CONNECT_TIMEOUT:5000}
medisphere.fhir.read-timeout=${FHIR_READ_TIMEOUT:10000}

spring.kafka.consumer.group-id=medisphere-vitals-live
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.medisphere.medispherebackend.kafka.VitalData
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.medisphere.medispherebackend.kafka,com.medisphere.medispherebackend.model

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
